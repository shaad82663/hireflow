services:
  db:
    image: pgvector/pgvector:pg16 # Postgres 16 + the pgvector extension we need in Part 5
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
      POSTGRES_DB: hireflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow"]
      interval: 5s
      retries: 10
  
  mailpit:
    image: axllent/mailpit:latest # catches every email locally; nothing reaches real inboxes
    ports:
      - "1025:1025" # SMTP: the app sends here
      - "8025:8025" # web inbox: open http://localhost:8025

volumes:
  pgdata: